version: "3.9"

services:
  docpilot:
    build: .
    image: docpilot:latest
    container_name: docpilot
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - path: .env
        required: false
    # The image ships code only. Build these on the host first:
    #   make demo-corpus && make train && make export && make quantize
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
    restart: unless-stopped
    # Uncomment to use NVIDIA GPU inside container:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
