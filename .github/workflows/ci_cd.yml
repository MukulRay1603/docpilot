name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install ruff && pip install -r test-requirements.txt

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Build demo corpus
        run: python data/build_demo_corpus.py

      - name: Smoke tests
        run: python -m tests.smoke_test

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docpilot:${{ github.sha }} .
