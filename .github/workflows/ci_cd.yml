name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint deps
        run: pip install ruff

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Install test deps
        run: |
          pip install \
            pytest \
            groq>=0.11.0 \
            rank-bm25==0.2.2 \
            transformers==4.51.3 \
            tokenizers>=0.21.0 \
            numpy>=1.26.0

      - name: Build demo corpus
        run: python data/build_demo_corpus.py

      - name: Smoke tests (security + audit + groq — no model required)
        run: python -m tests.smoke_test

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docpilot:${{ github.sha }} .

      # To push to a registry, add your credentials as repository secrets and
      # uncomment the steps below.
