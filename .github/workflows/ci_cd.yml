name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint + test deps
        run: pip install ruff pytest

      - name: Lint
        run: ruff check . --select E,F,W --ignore E501

      - name: Smoke test -- build demo corpus
        run: python data/build_demo_corpus.py

  docker:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t docpilot:${{ github.sha }} .

      # To push to a registry, add your credentials as repository secrets and
      # uncomment the steps below. The deploy/ folder has scripts for AWS ECR + EC2
      # blue/green deployment if you want to go that route.
